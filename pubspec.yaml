name: app_updater
description: A flutter package to update your app to the latest version with ease. Supports iOS, Android, macOS, Windows, and Linux with platform-native update dialogs.
version: 1.0.8
homepage: https://github.com/mantreshkhurana/app_updater
repository: https://github.com/mantreshkhurana/app_updater
issue_tracker: https://github.com/mantreshkhurana/app_updater/issues

topics:
  - app-update
  - version-checker
  - update-dialog
  - store-version

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.1
  http: ^1.2.2
  package_info_plus: ^9.0.0
  xml: ^6.5.0
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
