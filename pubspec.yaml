name: app_updater
description: A comprehensive Flutter package to check for app updates and display platform-native dialogs. Supports iOS, Android, macOS, Windows, and Linux with release notes, analytics, GitHub releases, Firebase Remote Config, localization, and more.
version: 2.0.0
homepage: https://github.com/mantreshkhurana/app_updater
repository: https://github.com/mantreshkhurana/app_updater
issue_tracker: https://github.com/mantreshkhurana/app_updater/issues

topics:
  - app-update
  - version-checker
  - update-dialog
  - store-version

environment:
  sdk: ^3.5.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.3.2
  http: ^1.6.0
  package_info_plus: ^9.0.0
  xml: ^6.6.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
